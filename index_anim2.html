<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Visualisation AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f0f0f0;
      }
      model-viewer {
        width: 100%;
        height: 90vh;
      }
    </style>
  </head>
<body>
	<model-viewer 
		id="paused-change-demo" 
		src="Cube_test_anim2.glb"  	   
		ar
		ar-modes="webxr scene-viewer"
		scale="0.002 0.002 0.002" 			
		autoplay 			  
		camera-controls touch-action="pan-y" 
		alt="An animated 3D model of a cube"		
		animation-name="CubeAction1" 
		shadow-intensity="1"		
		camera-controls 		
		xr-environment>
	</model-viewer>
	<script>
	  (() => {
	    const modelViewer = document.querySelector('#paused-change-demo');
	    self.setInterval(() => {
	      modelViewer.animationName = modelViewer.animationName === 'CubeAction1' ?
		'CubeAction2' : 'CubeAction1';
	    }, 2500.0);
	  })();
    	</script>
	  
  </body>
</html>
